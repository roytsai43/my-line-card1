<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台新證券 數位名片傳送助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #111827; }
        .theme-bg { background: linear-gradient(135deg, #e60012 0%, #b3000e 100%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-center text-white relative">

    <!-- 模式一：傳送工具主容器 (您自己操作時看到) -->
    <div id="mainContainer" class="max-w-xs w-full">
        <!-- 狀態顯示區 -->
        <div id="loadingUI">
            <div class="w-12 h-12 border-4 border-[#e60012] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <h1 class="text-lg font-bold">正在連線 LINE 傳送引擎</h1>
            <p id="statusDesc" class="text-gray-400 text-xs mt-2 text-balance">啟動中，請稍候...</p>
        </div>

        <!-- 手動按鈕區 -->
        <div id="manualUI" class="hidden">
            <div class="w-16 h-16 theme-bg rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-2xl">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
            </div>
            <h1 class="text-xl font-bold">分享名片給好友</h1>
            <button onclick="sendMyCard()" class="mt-8 w-full py-4 theme-bg text-white rounded-2xl font-black text-lg active:scale-95 transition-all shadow-lg">
                選取好友並發送
            </button>
        </div>

        <!-- 錯誤提示區 -->
        <div id="errorUI" class="hidden bg-red-500/10 border border-red-500/50 p-6 rounded-[2rem]">
            <h1 class="text-red-400 font-bold mb-2 text-lg">初始化失敗</h1>
            <p id="errorDetail" class="text-gray-300 text-xs leading-relaxed"></p>
            <button onclick="window.location.reload()" class="mt-4 text-[10px] text-white/50 underline uppercase tracking-widest">重新整理</button>
        </div>
    </div>

    <!-- 模式二：客戶接收端專用 - 純淨無廣告看圖區 (預設隱藏) -->
    <div id="imageViewerUI" class="hidden fixed inset-0 z-50 bg-black flex flex-col items-center justify-center">
        <!-- 關閉按鈕 -->
        <button onclick="liff.closeWindow()" class="absolute top-4 right-4 z-50 bg-white/20 p-2 rounded-full text-white backdrop-blur-md active:scale-95 transition-transform">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <!-- 圖片容器 -->
        <div class="w-full h-full overflow-auto flex items-center justify-center relative">
            <img id="viewerImg" src="" class="w-full h-auto object-contain max-h-full">
        </div>
    </div>

    <script>
        const MY_LIFF_ID = "2010402163-tC1IwZIT"; 
        const MY_LIFF_URL = "https://liff.line.me/" + MY_LIFF_ID;

        const starLine = (text) => ({
            "type": "box", "layout": "baseline", "spacing": "sm",
            "contents": [
                { "type": "text", "text": "★", "color": "#e60012", "flex": 0, "size": "sm" },
                { "type": "text", "text": text, "color": "#6b7280", "size": "sm", "wrap": true }
            ]
        });

        // 完整的三張名片結構
        const flexMessageJson = {
          "type": "carousel",
          "contents": [
            // 第一頁：個人簡介
            {
              "type": "bubble", "size": "mega",
              "header": {
                "type": "box", "layout": "horizontal", "backgroundColor": "#111111", "paddingAll": "lg",
                "contents": [
                  { "type": "text", "text": "PROFESSIONAL PROFILE", "color": "#e60012", "size": "xs", "weight": "bold", "flex": 1, "gravity": "center" },
                  { "type": "text", "text": "01", "color": "#222222", "align": "end", "size": "3xl", "weight": "bold", "flex": 0, "gravity": "center" }
                ]
              },
              "hero": { "type": "image", "url": "https://i.postimg.cc/V65Hsshq/ming-pian.jpg", "size": "full", "aspectRatio": "3:2", "aspectMode": "cover" },
              "body": {
                "type": "box", "layout": "vertical", "contents": [
                  { "type": "text", "text": "台新證券", "weight": "bold", "size": "xl", "color": "#111827" },
                  { "type": "text", "text": "TAISHIN SECURITIES", "size": "xs", "color": "#e60012", "margin": "xs", "weight": "bold" },
                  { "type": "separator", "margin": "md", "color": "#f3f4f6" },
                  { "type": "box", "layout": "vertical", "margin": "md", "spacing": "sm",
                    "contents": [
                      starLine("一站式整合開戶與極速下單體驗"),
                      starLine("提供全方位多元金融理財商品規劃"),
                      starLine("專業親切的投資顧問與即時市場分析")
                    ]
                  }
                ]
              },
              "footer": {
                "type": "box", "layout": "vertical", "spacing": "sm", "contents": [
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "✨ 加 LINE 好友", "uri": "https://line.me/ti/p/7kbEbMgAW5" }, "color": "#e60012" },
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "➤ 分享此名片", "uri": MY_LIFF_URL }, "color": "#404040" }
                ]
              }
            },
            // 第二頁：服務項目
            {
              "type": "bubble", "size": "mega",
              "header": {
                "type": "box", "layout": "horizontal", "backgroundColor": "#111111", "paddingAll": "lg",
                "contents": [
                  { "type": "text", "text": "SERVICES & SOLUTIONS", "color": "#e60012", "size": "xs", "weight": "bold", "flex": 1, "gravity": "center" },
                  { "type": "text", "text": "02", "color": "#222222", "align": "end", "size": "3xl", "weight": "bold", "flex": 0, "gravity": "center" }
                ]
              },
              "hero": { "type": "image", "url": "https://i.postimg.cc/qM6QZ5fM/xin-yong-ka.png", "size": "full", "aspectRatio": "3:2", "aspectMode": "cover" },
              "body": {
                "type": "box", "layout": "vertical", "contents": [
                  { "type": "text", "text": "我的專業服務項目", "weight": "bold", "size": "xl", "color": "#111827" },
                  { "type": "text", "text": "PROFESSIONAL SERVICES", "size": "xs", "color": "#9ca3af", "margin": "xs" },
                  { "type": "separator", "margin": "md", "color": "#f3f4f6" },
                  { "type": "box", "layout": "vertical", "margin": "md", "spacing": "sm",
                    "contents": [
                      starLine("證券交易下單"),
                      starLine("財富管理基金申購"),
                      starLine("信用卡申辦")
                    ]
                  }
                ]
              },
              "footer": {
                "type": "box", "layout": "vertical", "spacing": "sm", "contents": [
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "🛒 開戶連結", "uri": "https://eopen.tssco.com.tw/eopen/?openExternalBrowser=1#/home?ReferralOffice=192&ReferralCompany=8&ReferralCode=J1154526&ActivityCode=OUFB&Clerk=&SaleEmpId=J1154526&BranchId=192&bankBranch=&VersionType=3&MProId=" }, "color": "#e60012" },
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "🎬 信用卡申辦", "uri": "https://www.taishinbank.com.tw/eServiceA/CreditCardAP/apply/sc.jsp?sc=AAAC154526&pr=&sl=B23" }, "color": "#404040" }
                ]
              }
            },
            // 第三頁：技術分析與操作引導
            {
              "type": "bubble", "size": "mega",
              "header": {
                "type": "box", "layout": "horizontal", "backgroundColor": "#111111", "paddingAll": "lg",
                "contents": [
                  { "type": "text", "text": "TECHNICAL & OPERATION", "color": "#e60012", "size": "xs", "weight": "bold", "flex": 1, "gravity": "center" },
                  { "type": "text", "text": "03", "color": "#222222", "align": "end", "size": "3xl", "weight": "bold", "flex": 0, "gravity": "center" }
                ]
              },
              "hero": { "type": "image", "url": "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=800&auto=format&fit=crop", "size": "full", "aspectRatio": "3:2", "aspectMode": "cover" },
              "body": {
                "type": "box", "layout": "vertical", "contents": [
                  { "type": "text", "text": "技術分析與操作引導", "weight": "bold", "size": "xl", "color": "#111827" },
                  { "type": "text", "text": "CHART ANALYSIS & LIMITS", "size": "xs", "color": "#9ca3af", "margin": "xs" },
                  { "type": "separator", "margin": "md", "color": "#f3f4f6" },
                  { "type": "box", "layout": "vertical", "margin": "md", "spacing": "sm",
                    "contents": [
                      starLine("處置股與圈存交易流程教學"),
                      starLine("交易額度提升操作指引")
                    ]
                  }
                ]
              },
              "footer": {
                "type": "box", "layout": "vertical", "spacing": "sm", "contents": [
                  // 注意：這裡改成連到您的 LIFF 網址，並在後面加上秘密標記 (#quan_cun 和 #ti_gao)
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "📈 再處置股交易操作", "uri": MY_LIFF_URL + "#quan_cun" }, "color": "#e60012" },
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "💳 提高交易額度操作", "uri": MY_LIFF_URL + "#ti_gao" }, "color": "#222222" }
                ]
              }
            }
          ]
        };

        async function sendMyCard() {
            try {
                if (!liff.isApiAvailable('shareTargetPicker')) {
                    document.getElementById('loadingUI').classList.add('hidden');
                    document.getElementById('errorUI').classList.remove('hidden');
                    document.getElementById('errorDetail').innerText = "⚠️ 錯誤：您的 LINE 版本或環境不支援分享功能。";
                    return;
                }
                const res = await liff.shareTargetPicker([
                    {
                        "type": "flex",
                        "altText": "台新證券數位名片分享",
                        "contents": flexMessageJson
                    }
                ]);
                
                if (res) { 
                    liff.closeWindow(); 
                } else {
                    document.getElementById('loadingUI').classList.add('hidden');
                    document.getElementById('manualUI').classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                document.getElementById('loadingUI').classList.add('hidden');
                document.getElementById('manualUI').classList.remove('hidden');
            }
        }

        async function main() {
            // ★ 核心魔法：檢查網址後方是否帶有特定標籤 (#quan_cun 或 #ti_gao)
            const hash = window.location.hash;
            
            // 如果帶有標籤，代表這是「客戶點擊名片按鈕進來看圖」的
            if (hash === '#quan_cun' || hash === '#ti_gao') {
                // 隱藏您的發送工具介面
                document.getElementById('mainContainer').classList.add('hidden');
                // 將頁面外觀重置，打造全黑乾淨的看圖體驗
                document.body.classList.remove('p-6');
                document.body.classList.add('p-0', 'bg-black');
                
                const viewerUI = document.getElementById('imageViewerUI');
                const viewerImg = document.getElementById('viewerImg');
                
                // 根據不同的標籤，載入對應的圖檔
                if (hash === '#quan_cun') {
                    viewerImg.src = 'https://i.postimg.cc/9fT3THH8/quan-cun-yu-shou-gu-piao.png';
                } else if (hash === '#ti_gao') {
                    viewerImg.src = 'https://i.postimg.cc/d30TNYvC/Chat-GPT-Image-2026nian6yue15ri-xia-wu10-53-46.png';
                }
                
                // 顯示看圖區
                viewerUI.classList.remove('hidden');
                
                // 依然需要初始化 liff，這樣客戶看完圖點擊右上角的 X 才能順利關閉視窗回到聊天室
                await liff.init({ liffId: MY_LIFF_ID });
                return; // 直接結束，不再執行下方要求登入和傳送名片的程式
            }

            // 如果網址沒有標籤，代表是您打開工具要發送名片，則執行原本的發送邏輯
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    sendMyCard();
                }
            } catch (err) {
                document.getElementById('loadingUI').classList.add('hidden');
                document.getElementById('errorUI').classList.remove('hidden');
                document.getElementById('errorDetail').innerText = err.message;
            }
        }

        window.onload = main;
    </script>
</body>
</html>
