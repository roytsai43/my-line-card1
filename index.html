<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台新證券 數位名片傳送助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #111827; }
        .theme-bg { background: linear-gradient(135deg, #e60012 0%, #b3000e 100%); } /* 台新紅質感漸層 */
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-center text-white">

    <div class="max-w-xs w-full">
        <!-- 狀態顯示區 -->
        <div id="loadingUI">
            <div class="w-12 h-12 border-4 border-[#e60012] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <h1 class="text-lg font-bold">正在連線 LINE 傳送引擎</h1>
            <p id="statusDesc" class="text-gray-400 text-xs mt-2 text-balance">啟動中，請稍候...</p>
        </div>

        <!-- 手動按鈕區 -->
        <div id="manualUI" class="hidden">
            <div class="w-16 h-16 theme-bg rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-2xl">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
            </div>
            <h1 class="text-xl font-bold">分享名片給好友</h1>
            <button onclick="sendMyCard()" class="mt-8 w-full py-4 theme-bg text-white rounded-2xl font-black text-lg active:scale-95 transition-all shadow-lg">
                選取好友並發送
            </button>
        </div>

        <!-- 錯誤提示區 (增強除錯資訊) -->
        <div id="errorUI" class="hidden bg-red-500/10 border border-red-500/50 p-6 rounded-[2rem]">
            <h1 class="text-red-400 font-bold mb-2 text-lg">⚠️ 執行失敗</h1>
            <p id="errorDetail" class="text-gray-300 text-xs leading-relaxed text-left break-words"></p>
            <button onclick="window.location.reload()" class="mt-6 w-full py-2 bg-white/10 rounded text-sm text-white hover:bg-white/20 transition-all">重新整理</button>
        </div>
    </div>

    <script>
        const MY_LIFF_ID = "2010402163-tC1IwZIT"; 
        const MY_LIFF_URL = "https://liff.line.me/" + MY_LIFF_ID;

        const starLine = (text) => ({
            "type": "text",
            "contents": [
                { "type": "span", "text": "★ ", "color": "#e60012" }, 
                { "type": "span", "text": text }
            ],
            "size": "sm",
            "color": "#6b7280",
            "wrap": true
        });

        const flexMessageJson = {
          "type": "carousel",
          "contents": [
            // 第一頁
            {
              "type": "bubble",
              "size": "mega",
              "header": {
                "type": "box", "layout": "vertical", "backgroundColor": "#111111", "paddingAll": "16px",
                "contents": [
                  { "type": "text", "text": "PROFESSIONAL PROFILE", "color": "#e60012", "size": "xxs", "weight": "bold", "letterSpacing": "0.15em" },
                  { "type": "text", "text": "01", "color": "#222222", "align": "end", "size": "3xl", "weight": "bold", "position": "absolute", "offsetTop": "5px", "offsetEnd": "15px" }
                ]
              },
              "hero": { "type": "image", "url": "https://i.postimg.cc/V65Hsshq/ming-pian.jpg", "size": "full", "aspectRatio": "1.5:1", "aspectMode": "cover" },
              "body": {
                "type": "box", "layout": "vertical", "contents": [
                  { "type": "text", "text": "台新證券", "weight": "bold", "size": "xl", "color": "#111827" },
                  { "type": "text", "text": "TAISHIN SECURITIES", "size": "xs", "color": "#e60012", "margin": "xs", "weight": "bold" },
                  { "type": "separator", "margin": "md", "color": "#f3f4f6" },
                  { "type": "box", "layout": "vertical", "margin": "md", "spacing": "sm",
                    "contents": [
                      starLine("一站式整合開戶與極速下單體驗"),
                      starLine("提供全方位多元金融理財商品規劃"),
                      starLine("專業親切的投資顧問與即時市場分析")
                    ]
                  }
                ]
              },
              "footer": {
                "type": "box", "layout": "vertical", "spacing": "sm", "contents": [
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "✨ 加 LINE 好友", "uri": "https://line.me/ti/p/7kbEbMgAW5" }, "color": "#e60012" },
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "➤ 分享此名片", "uri": MY_LIFF_URL }, "color": "#404040" }
                ]
              }
            },
            // 第二頁
            {
              "type": "bubble",
              "size": "mega",
              "header": {
                "type": "box", "layout": "vertical", "backgroundColor": "#111111", "paddingAll": "16px",
                "contents": [
                  { "type": "text", "text": "SERVICES & SOLUTIONS", "color": "#e60012", "size": "xxs", "weight": "bold", "letterSpacing": "0.15em" },
                  { "type": "text", "text": "02", "color": "#222222", "align": "end", "size": "3xl", "weight": "bold", "position": "absolute", "offsetTop": "5px", "offsetEnd": "15px" }
                ]
              },
              "hero": { "type": "image", "url": "https://i.postimg.cc/qM6QZ5fM/xin-yong-ka.png", "size": "full", "aspectRatio": "1.5:1", "aspectMode": "cover" },
              "body": {
                "type": "box", "layout": "vertical", "contents": [
                  { "type": "text", "text": "我的專業服務項目", "weight": "bold", "size": "xl", "color": "#111827" },
                  { "type": "text", "text": "PROFESSIONAL SERVICES", "size": "xs", "color": "#9ca3af", "margin": "xs" },
                  { "type": "separator", "margin": "md", "color": "#f3f4f6" },
                  { "type": "box", "layout": "vertical", "margin": "md", "spacing": "sm",
                    "contents": [
                      starLine("證券交易下單"),
                      starLine("財富管理基金申購"),
                      starLine("信用卡申辦")
                    ]
                  }
                ]
              },
              "footer": {
                "type": "box", "layout": "vertical", "spacing": "sm", "contents": [
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "🛒 開戶連結", "uri": "https://eopen.tssco.com.tw/eopen/?openExternalBrowser=1#/home?ReferralOffice=192&ReferralCompany=8&ReferralCode=J1154526&ActivityCode=OUFB&Clerk=&SaleEmpId=J1154526&BranchId=192&bankBranch=&VersionType=3&MProId=" }, "color": "#e60012" },
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "🎬 信用卡申辦", "uri": "https://www.taishinbank.com.tw/eServiceA/CreditCardAP/apply/sc.jsp?sc=AAAC154526&pr=&sl=23" }, "color": "#404040" }
                ]
              }
            }
          ]
        };

        // 顯示錯誤的輔助函式
        function showError(msg) {
            document.getElementById('loadingUI').classList.add('hidden');
            document.getElementById('manualUI').classList.add('hidden');
            document.getElementById('errorUI').classList.remove('hidden');
            document.getElementById('errorDetail').innerText = msg;
        }

        async function sendMyCard() {
            try {
                // 檢查 API 是否可用，若不可用代表後台可能沒開 Share Target Picker
                if (!liff.isApiAvailable('shareTargetPicker')) {
                    showError("分享功能無法使用。\n\n請確認：\n1. 您是否在 LINE App 內開啟此網頁。\n2. 開發者後台的 Share Target Picker 是否已開啟 (Enabled)。");
                    return;
                }
                
                const res = await liff.shareTargetPicker([
                    {
                        "type": "flex",
                        "altText": "台新證券數位名片分享",
                        "contents": flexMessageJson
                    }
                ]);
                
                if (res) { 
                    liff.closeWindow(); 
                } else {
                    document.getElementById('loadingUI').classList.add('hidden');
                    document.getElementById('manualUI').classList.remove('hidden');
                }
            } catch (err) {
                // 捕捉到錯誤時，將錯誤轉成文字印出，方便您除錯 Flex Message JSON 是否有誤
                console.error(err);
                showError("發送發生錯誤：\n" + (err.message || JSON.stringify(err)) + "\n\n(若顯示 Invalid argument，代表 Flex Message 格式可能不被支援)");
            }
        }

        async function main() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    sendMyCard();
                }
            } catch (err) {
                showError("LIFF 初始化失敗：\n" + err.message);
            }
        }

        window.onload = main;
    </script>
</body>
</html>
